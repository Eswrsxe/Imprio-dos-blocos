<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação - Império dos Blocos</title>
    <style>
        /* CSS Embutido para facilitar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at center, #2a2a2a 0%, #111 100%);
        }

        .container {
            background-color: #2C2F33;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-top: 6px solid #9E1B32; /* Carmesim */
            max-width: 450px;
            width: 90%;
            transition: transform 0.3s ease;
        }

        h1 {
            color: #D4AF37; /* Dourado */
            margin-bottom: 15px;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #b9bbbe;
            margin-bottom: 25px;
        }

        .btn-discord {
            background-color: #5865F2; /* Cor oficial do Discord */
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.2s, transform 0.2s;
            width: 100%;
        }

        .btn-discord:hover {
            background-color: #4752C4;
            transform: translateY(-2px);
        }

        .loader {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #9E1B32;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #status-message {
            margin-top: 20px;
            font-weight: bold;
        }
        
        .success { color: #43b581; font-size: 20px;}
        .error { color: #f04747; }
    </style>
</head>
<body>

    <div class="container" id="main-card">
        <h1>🏰 IMPÉRIO DOS BLOCOS</h1>
        <p id="desc-text">Para liberar seu acesso completo ao servidor, precisamos vincular sua conta do Discord de forma segura.</p>
        
        <button class="btn-discord" id="btn-verify">Autorizar com o Discord</button>
        
        <div class="loader" id="loader"></div>
        <div id="status-message"></div>
    </div>

    <!-- JavaScript Responsável pela Lógica de URL e Status -->
    <script>
        const btnVerify = document.getElementById('btn-verify');
        const loader = document.getElementById('loader');
        const statusMsg = document.getElementById('status-message');
        const descText = document.getElementById('desc-text');

        // URL do OAuth2 do Discord (Configure com o SEU Client ID)
        // Note o redirect_uri apontando para a sua futura API
        const clientId = '1535446090843955220'; 
        // 👇 Agora ele aponta para a API que criamos no Passo 2!
        const redirectUri = encodeURIComponent('https://imprio-dos-blocos.vercel.app/api/callback');
        const discordAuthUrl = `https://discord.com/oauth2/authorize?client_id=${clientId}&response_type=code&redirect_uri=${redirectUri}&scope=identify`;

        // Verifica se o usuário acabou de voltar do Discord com Sucesso ou Erro
        const urlParams = new URLSearchParams(window.location.search);
        const status = urlParams.get('status');

        if (status === 'success') {
            btnVerify.style.display = 'none';
            descText.style.display = 'none';
            statusMsg.innerHTML = '<span class="success">✅ Verificação Concluída!</span><br><br>Seus cargos foram entregues. Pode voltar para o servidor!';
        } else if (status === 'error') {
            statusMsg.innerHTML = '<span class="error">❌ Ocorreu um erro na verificação. Tente novamente.</span>';
        }

        // Ação do Botão
        btnVerify.addEventListener('click', () => {
            btnVerify.style.display = 'none';
            loader.style.display = 'block';
            statusMsg.innerText = 'Redirecionando para o Discord...';
            
            // Vai para o Discord pedir permissão
            window.location.href = discordAuthUrl;
        });
    </script>
</body>
</html>
